<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Придумай пароль</title>
<style>
  :root{--bg:#f4f1ff;--card:#fff;--ink:#241b4b;--ok:#1f9d55;--bad:#d93b3b;--acc:#6c4cf5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:16px;display:flex;justify-content:center}
  main{width:100%;max-width:520px}
  h1{text-align:center;margin:8px 0 4px}
  .sub{text-align:center;color:#6b6490;margin:0 0 16px}
  input{width:100%;font-size:22px;padding:14px;border:3px solid var(--acc);border-radius:12px;outline:none;font-family:monospace}
  .meta{display:flex;justify-content:space-between;margin:8px 2px 14px;color:#6b6490;font-size:14px}
  .rule{background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;border-left:6px solid var(--bad);
        box-shadow:0 2px 6px #0001;display:flex;gap:10px;align-items:center}
  .rule.ok{border-color:var(--ok)}
  .rule .n{font-weight:700;opacity:.5}
  #win{display:none;text-align:center;background:var(--ok);color:#fff;border-radius:12px;padding:16px;margin-top:12px;font-size:18px}
  button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>🔑 Придумай пароль</h1>
  <p class="sub">Правила появляются по одному. Выполни все — и пароль принят!</p>
  <input id="pw" autocomplete="off" placeholder="Введи пароль..." autofocus>
  <div class="meta"><span id="len">Длина: 0</span><span id="prog"></span></div>
  <div id="rules"></div>
  <div id="win">🎉 Пароль принят! Ты справился со всеми правилами.<br><button id="copy">Скопировать пароль</button></div>
</main>
<script>
const RULES=[
  ["Минимум 8 символов", p=>p.length>=8],
  ["Есть заглавная буква", p=>/[A-ZА-ЯЁ]/.test(p)],
  ["Есть строчная буква", p=>/[a-zа-яё]/.test(p)],
  ["Есть цифра", p=>/\d/.test(p)],
  ["Есть спецсимвол (!@#$%&*?)", p=>/[!@#$%&*?]/.test(p)],
  ["Сумма всех цифр равна 15", p=>(p.match(/\d/g)||[]).reduce((a,b)=>a+ +b,0)===15],
  ["Содержит название месяца (например «май» или «июнь»)", p=>/(январ|феврал|март|апрел|май|июн|июл|август|сентябр|октябр|ноябр|декабр)/i.test(p)],
  ["Содержит римскую цифру XXXV (35)", p=>p.includes("XXXV")],
  ["Содержит эмодзи 🌟", p=>p.includes("🌟")],
  ["Нет подряд идущих одинаковых символов", p=>p.length>0&&!/(.)\1/u.test(p)],
  ["Длина пароля — простое число", p=>{const n=[...p].length;if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}],
];
const pw=document.getElementById('pw'),box=document.getElementById('rules'),win=document.getElementById('win');
let shown=1;
function update(){
  const p=pw.value;
  document.getElementById('len').textContent="Длина: "+[...p].length;
  const res=RULES.map(r=>r[1](p));
  // показываем следующее правило, когда выполнены все показанные
  while(shown<RULES.length && res.slice(0,shown).every(Boolean)) shown++;
  box.innerHTML='';
  // невыполненные сверху
  const items=[];
  for(let i=0;i<shown;i++) items.push(i);
  items.sort((a,b)=>(res[a]-res[b])||(b-a));
  items.forEach(i=>{
    const d=document.createElement('div'); d.className='rule'+(res[i]?' ok':'');
    d.innerHTML=`<span class="n">${i+1}</span><span>${res[i]?'✅':'❌'} ${RULES[i][0]}</span>`;
    box.append(d);
  });
  const done=res.filter(Boolean).length;
  document.getElementById('prog').textContent=`Выполнено: ${done}/${RULES.length}`;
  win.style.display=res.every(Boolean)?'block':'none';
}
pw.addEventListener('input',update);
document.getElementById('copy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(pw.value);
update();
</script>
</body>
</html>
