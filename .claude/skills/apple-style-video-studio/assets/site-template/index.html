<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Product</title>
<meta name="description" content="">
<!--
  Шаблон сайта в стиле Apple. Меняй: токены в :root (из brief.json), тексты в I18N, секции в <main>.
  Без внешних зависимостей: работает офлайн и открывается двойным кликом.
  Тексты ТОЛЬКО через data-i18n и textContent — никакого innerHTML (защита от XSS).
-->
<style>
  :root{
    --bg:#fbfbfd;--fg:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--card:#fff;--line:rgba(0,0,0,.1);
    --radius:22px;--maxw:1080px;--ease:cubic-bezier(.22,1,.36,1);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans SC",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--card:#161617;--line:rgba(255,255,255,.14)}}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.47 var(--font);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .skip{position:absolute;inset-inline-start:-999px}.skip:focus{inset-inline-start:12px;top:12px;background:var(--card);padding:8px 14px;border-radius:10px;z-index:10}
  header{position:sticky;top:0;z-index:5;backdrop-filter:saturate(180%) blur(20px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
  .bar{max-width:var(--maxw);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;justify-content:space-between}
  .brand{font-weight:650;letter-spacing:-.01em;color:var(--fg)}
  .bar nav{display:flex;gap:22px;font-size:14px}.bar nav a{color:var(--muted)}.bar nav a:hover{color:var(--fg)}
  select{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  section{padding:clamp(64px,12vw,140px) 20px;text-align:center}
  .wrap{max-width:var(--maxw);margin:0 auto}
  h1{font-size:clamp(40px,8vw,88px);line-height:1.04;letter-spacing:-.03em;margin:0 0 16px;font-weight:700}
  h2{font-size:clamp(30px,5vw,56px);line-height:1.08;letter-spacing:-.025em;margin:0 0 14px;font-weight:650}
  .lead{font-size:clamp(19px,2.6vw,28px);color:var(--muted);max-width:720px;margin:0 auto 28px;line-height:1.3}
  .btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 24px;border-radius:999px;font-weight:500;transition:transform .4s var(--ease)}
  .btn:hover{transform:scale(1.03)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:48px;text-align:start}
  .card{background:var(--card);border-radius:var(--radius);padding:32px;border:1px solid var(--line)}
  .card svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
  .card h3{margin:0 0 6px;font-size:21px;letter-spacing:-.01em}.card p{margin:0;color:var(--muted)}
  video{width:100%;border-radius:var(--radius);margin-top:40px;background:#000}
  footer{padding:40px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
  .reveal{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.btn{transition:none}}
  @media (max-width:640px){.bar nav{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header><div class="bar">
  <a class="brand" href="#top" data-i18n="brand">Brand</a>
  <nav aria-label="Main"><a href="#features" data-i18n="nav.features">Features</a><a href="#video" data-i18n="nav.video">Video</a><a href="#cta" data-i18n="nav.cta">Get started</a></nav>
  <select id="lang" aria-label="Language"></select>
</div></header>

<main id="main">
  <section id="top"><div class="wrap">
    <h1 class="reveal" data-i18n="hero.title">One clear idea.</h1>
    <p class="lead reveal" data-i18n="hero.sub">A short, honest sentence about what this does.</p>
    <a class="btn reveal" href="#cta" data-i18n="hero.cta">Get started</a>
  </div></section>

  <section id="features"><div class="wrap">
    <h2 class="reveal" data-i18n="features.title">Everything you need.</h2>
    <div class="grid">
      <!-- Иконки: свой SVG-набор из assets/icons, одна сетка 24px, stroke=currentColor -->
      <article class="card reveal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><h3 data-i18n="f1.t">Fast</h3><p data-i18n="f1.d">Short description.</p></article>
      <article class="card reveal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg><h3 data-i18n="f2.t">Private</h3><p data-i18n="f2.d">Short description.</p></article>
      <article class="card reveal"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><h3 data-i18n="f3.t">Everywhere</h3><p data-i18n="f3.d">Short description.</p></article>
    </div>
  </div></section>

  <section id="video"><div class="wrap">
    <h2 class="reveal" data-i18n="video.title">See it in action.</h2>
    <!-- Подставь видео из этапа 4: <video controls playsinline preload="metadata" src="video.en.mp4"> -->
    <video id="promo" controls playsinline preload="metadata"></video>
  </div></section>

  <section id="cta"><div class="wrap">
    <h2 class="reveal" data-i18n="cta.title">Ready when you are.</h2>
    <a class="btn reveal" href="#top" data-i18n="cta.btn">Get started</a>
  </div></section>
</main>
<footer><span data-i18n="footer">© Brand</span></footer>

<script>
(function(){
  // ВСЕ тексты здесь. Добавляй языки блоком; fallback — en.
  var I18N={
    en:{_name:"English",skip:"Skip to content",brand:"Brand","nav.features":"Features","nav.video":"Video","nav.cta":"Get started",
      "hero.title":"One clear idea.","hero.sub":"A short, honest sentence about what this does.","hero.cta":"Get started",
      "features.title":"Everything you need.","f1.t":"Fast","f1.d":"Short description.","f2.t":"Private","f2.d":"Short description.","f3.t":"Everywhere","f3.d":"Short description.",
      "video.title":"See it in action.","cta.title":"Ready when you are.","cta.btn":"Get started","footer":"© Brand"},
    ru:{_name:"Русский",skip:"К содержимому",brand:"Бренд","nav.features":"Возможности","nav.video":"Видео","nav.cta":"Начать",
      "hero.title":"Одна ясная идея.","hero.sub":"Короткое честное предложение о том, что это делает.","hero.cta":"Начать",
      "features.title":"Всё, что нужно.","f1.t":"Быстро","f1.d":"Краткое описание.","f2.t":"Приватно","f2.d":"Краткое описание.","f3.t":"Везде","f3.d":"Краткое описание.",
      "video.title":"Смотрите в деле.","cta.title":"Когда будете готовы.","cta.btn":"Начать","footer":"© Бренд"},
    ar:{_name:"العربية",skip:"انتقل إلى المحتوى",brand:"العلامة","nav.features":"المزايا","nav.video":"فيديو","nav.cta":"ابدأ",
      "hero.title":"فكرة واحدة واضحة.","hero.sub":"جملة قصيرة وصادقة عمّا يفعله هذا.","hero.cta":"ابدأ",
      "features.title":"كل ما تحتاجه.","f1.t":"سريع","f1.d":"وصف قصير.","f2.t":"خاص","f2.d":"وصف قصير.","f3.t":"في كل مكان","f3.d":"وصف قصير.",
      "video.title":"شاهده أثناء العمل.","cta.title":"جاهزون متى شئت.","cta.btn":"ابدأ","footer":"© العلامة"}
  };
  var VIDEO={en:"video.en.mp4",ru:"video.ru.mp4",ar:"video.ar.mp4"}; // относительные имена файлов
  var RTL={ar:1,he:1,fa:1,ur:1};
  var sel=document.getElementById("lang"),promo=document.getElementById("promo");

  Object.keys(I18N).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=I18N[c]._name;sel.appendChild(o);});

  function t(code,key){return (I18N[code]&&I18N[code][key])||I18N.en[key]||"";}
  function apply(code){
    if(!I18N[code])code="en";
    document.documentElement.lang=code;document.documentElement.dir=RTL[code]?"rtl":"ltr";
    document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(code,el.getAttribute("data-i18n"));});
    document.title=t(code,"brand")+" — "+t(code,"hero.title");
    var v=VIDEO[code]||VIDEO.en;if(v&&/^[\w.\- ]+\.(mp4|webm)$/i.test(v)){promo.src=v;}
    sel.value=code;try{localStorage.setItem("lang",code);}catch(e){}
  }
  function detect(){
    var s=null;try{s=localStorage.getItem("lang");}catch(e){}
    var list=[s].concat(navigator.languages||[navigator.language||"en"]);
    for(var i=0;i<list.length;i++){if(!list[i])continue;var c=list[i].toLowerCase().split("-")[0];if(I18N[c])return c;}
    return "en";
  }
  sel.addEventListener("change",function(){apply(sel.value);});
  apply(detect());

  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.15});
    document.querySelectorAll(".reveal").forEach(function(el){io.observe(el);});
  }else{document.querySelectorAll(".reveal").forEach(function(el){el.classList.add("in");});}
})();
</script>
</body>
</html>
