# Render: New → Blueprint → выберите репозиторий. Ключ ANTHROPIC_API_KEY задайте в панели (sync: false).
services:
  - type: web
    name: jova
    runtime: docker
    rootDir: jova
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: jova-data
      mountPath: /app/data
      sizeGB: 1
