<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blue Dash</title>
<style>
/* Layout: fullscreen canvas game, thumb pads at bottom corners, overlay menu for chapters. Single dark arcade look by choice. */
:root{--bg:#0a1a44;--fg:#ffffff;--accent:#ffd21f;--pad:rgba(255,255,255,.2);--pad-on:rgba(255,255,255,.5);--jump:rgba(255,70,70,.35);--jump-on:rgba(255,70,70,.7);--card:rgba(255,255,255,.08);--ui:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
#dpad{pointer-events:auto;display:flex;width:168px;height:80px;border-radius:40px;background:var(--pad);touch-action:none}
#dpad span{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;border-radius:40px}
#dpad span.on{background:var(--pad-on)}
.rt{display:flex;gap:12px;align-items:flex-end}
.rt button{pointer-events:auto;touch-action:none;border:0;color:var(--fg);font:700 15px var(--ui);letter-spacing:.06em;border-radius:50%;background:var(--pad)}
#bd{width:66px;height:66px;font-size:26px}
#bj{width:92px;height:92px;background:var(--jump)}
.rt button.on{background:var(--pad-on)}
#bj.on{background:var(--jump-on)}
#pb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border:0;border-radius:50%;background:var(--pad);color:var(--fg);font-size:20px;touch-action:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,12,40,.86);text-align:center;padding:20px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;touch-action:pan-y}
#ov[hidden]{display:none}
#ot{margin:0;font-size:clamp(34px,9vw,60px);font-style:italic;font-weight:900;letter-spacing:.02em;color:var(--accent);text-shadow:0 4px 0 #b06a00;text-wrap:balance}
#ob{margin:0;max-width:36ch;line-height:1.45;font-size:16px;color:#cdd8ff;white-space:pre-line}
#ob:empty{display:none}
#btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.b{padding:13px 28px;border:0;border-radius:999px;background:var(--accent);color:#1a1200;font:800 18px var(--ui);cursor:pointer}
.b.alt{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
.b:disabled{opacity:.35;cursor:default}
#sel{display:flex;flex-direction:column;gap:8px;width:min(440px,100%)}
#sel:empty{display:none}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--card)}
.row .nm{flex:1;min-width:0;text-align:left;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.row .b{padding:9px 14px;font-size:14px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><canvas id="c"></canvas>
<button id="pb" aria-label="Меню">☰</button>
<div id="pad">
  <div id="dpad"><span id="dl">◀</span><span id="dr">▶</span></div>
  <div class="rt"><button id="bd" data-k="d" aria-label="Вниз / кручение">▼</button><button id="bj" data-k="j" aria-label="Прыжок">ПРЫЖОК</button></div>
</div>
<div id="ov">
  <h1 id="ot">Blue Dash</h1>
  <p id="ob"></p>
  <div id="sel"></div>
  <div id="btns"></div>
</div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ot=document.getElementById('ot'),ob=document.getElementById('ob'),selEl=document.getElementById('sel'),btnsEl=document.getElementById('btns');
let VW=400,VH=224,SC=1,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);const w=innerWidth,h=innerHeight;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);let s=h/224;if(w/s<340)s=w/340;SC=s;VW=w/s;VH=h/s}
addEventListener('resize',resize);resize();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#ov'))e.preventDefault()},{passive:false});

/* ---------- audio ---------- */
let ac=null;
function initAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f,d,type,v,sl){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ---------- chapters ---------- */
const ZONES=[
 {n:'Зелёные холмы',sky:['#2a7fe0','#9fd8ff'],far:'#5aa6e8',mid:'#2fa65a',f1:'#9a5a22',f2:'#7d4515',g1:'#27a04a',g2:'#7ee06a',amp:1,grip:1,en:'#e03030',bc:'#e03030',fx:0,dot:'#2fa65a'},
 {n:'Пустыня Зноя',sky:['#e8742c','#ffd9a0'],far:'#e0a060',mid:'#c88a48',f1:'#d9a95a',f2:'#c8964a',g1:'#f0c878',g2:'#ffe3a8',amp:1.15,grip:1,en:'#a05a10',bc:'#d98a1a',fx:1,dot:'#e8a040'},
 {n:'Ледяные пики',sky:['#6a8fc0','#dff0ff'],far:'#a8c8e8',mid:'#7fa6cc',f1:'#8fb8d8',f2:'#7aa5c8',g1:'#e8f6ff',g2:'#ffffff',amp:.9,grip:.25,en:'#3a9ad0',bc:'#4aa8e8',fx:2,dot:'#8fd0ff'},
 {n:'Лавовая крепость',sky:['#2a0a22','#8a2a1a'],far:'#3a1530',mid:'#4a1a1a',f1:'#4a2a2a',f2:'#3a1e1e',g1:'#b03a1a',g2:'#ff8a3a',amp:1.2,grip:1,en:'#9a40d0',bc:'#7a2fc0',fx:3,dot:'#ff6a2a'}
];
const ACTN=['Акт 1','Акт 2','Босс'];
const KITS=[['bomb','dive'],['charge','bomb','dive'],['shoot','dive','shoot','bomb'],['dive','charge','shoot','bomb']];
const BHP=[6,7,8,10];
const LEVELS=[];for(let z=0;z<4;z++)for(let a=0;a<3;a++)LEVELS.push({z,act:a});
let unlocked=0;
try{unlocked=Math.min(11,Math.max(0,parseInt(localStorage.getItem('blueDashUnlocked'))||0))}catch(e){}
function saveProg(){try{localStorage.setItem('blueDashUnlocked',String(unlocked))}catch(e){}}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- level data ---------- */
const R=13;
let LEN=5000,GOAL=4700,hm,pitm,pits=[],cps=[],springs=[],spikes=[],fireballs=[],rings=[],enemies=[],fly=[],parts=[],bombs=[],shots=[];
let Z=ZONES[0],isBoss=false,boss=null,cur=0;
function inPit(x){x=Math.floor(x);return x>=0&&x<pitm.length&&pitm[x]===1}
function ground(x){
  if(x<0)x=0;if(x>hm.length-2)x=hm.length-2;
  const i=Math.floor(x);if(pitm[i]||pitm[i+1])return 700;
  const f=x-i;return hm[i]*(1-f)+hm[i+1]*f;
}
function slope(x){
  if(inPit(x-8)||inPit(x+8))return{x:1,y:0};
  const dy=ground(x+6)-ground(x-6),l=Math.hypot(12,dy);return{x:12/l,y:dy/l};
}
function nearPit(x,m){return pits.some(q=>x>q[0]-m&&x<q[1]+m)}
function genLevel(i){
  const L=LEVELS[i];Z=ZONES[L.z];isBoss=L.act===2;boss=null;cur=i;
  const rnd=mulberry(L.z*977+L.act*131+7);
  LEN=isBoss?1500:(L.act===0?5200:6800)+L.z*400;
  GOAL=isBoss?1e9:LEN-300;
  hm=new Float32Array(LEN+420);pitm=new Uint8Array(LEN+420);
  pits=[];cps=[];springs=[];spikes=[];fireballs=[];rings=[];enemies=[];fly=[];parts=[];bombs=[];shots=[];
  if(!isBoss){
    const n=(L.act===0?2:3)+L.z,span=LEN-2400;
    for(let k=0;k<n;k++){const w=(L.z===3?115:95)+Math.floor(rnd()*35),c=1100+(k+.5)*span/n+(rnd()-.5)*60;pits.push([Math.floor(c-w/2),Math.floor(c+w/2)])}
  }
  const ph1=rnd()*6,ph2=rnd()*6,A=Z.amp,f1=75+rnd()*40,f2=190+rnd()*80;
  for(let x=0;x<hm.length;x++){
    const e=isBoss?0:Math.min(1,Math.max(0,(x-350)/500))*Math.min(1,Math.max(0,(LEN-200-x)/400));
    hm[x]=150+e*(Math.sin(x/f1+ph1)*26*A+Math.sin(x/f2+ph2)*38*A+Math.sin(x/47)*4);
    for(const q of pits)if(x>q[0]&&x<q[1])pitm[x]=1;
  }
  if(!isBoss){
    for(const k of[1,2]){let x=Math.round(LEN*k/3);while(nearPit(x,160))x+=40;cps.push({x,on:false})}
    for(let k=0;k<2+L.act;k++){let x,g=0;do{x=1000+rnd()*(LEN-2000);g++}while(nearPit(x,150)&&g<50);springs.push({x:Math.floor(x),t:0})}
    if(L.z>=1){
      const n=2+L.z*2+L.act;
      for(let k=0;k<n;k++){let x,g=0;do{x=900+rnd()*(GOAL-1300);g++}while((nearPit(x,150)||springs.some(s=>Math.abs(s.x-x)<110)||cps.some(c=>Math.abs(c.x-x)<90))&&g<80);spikes.push({x:Math.floor(x)})}
    }
    const n=Math.floor((LEN-1200)/(380-L.z*25));
    for(let k=0;k<n;k++){
      const x=900+k*(LEN-1500)/n+rnd()*100;if(nearPit(x,190))continue;
      const f=(L.z>=1||L.act>=1)&&rnd()<.35;
      enemies.push({x,x0:x-80,x1:x+80,d:rnd()<.5?-1:1,alive:true,y:0,ph:rnd()*6,f});
    }
    if(L.z===3)for(const q of pits)fireballs.push({x:(q[0]+q[1])/2,y:290,vy:0,t:Math.floor(rnd()*100)});
    for(let gx=300;gx<LEN-400;gx+=240){
      if(nearPit(gx,120)||nearPit(gx+110,120))continue;
      for(let k=0;k<5;k++){const x=gx+k*22;rings.push({x,y:ground(x)-30,got:false})}
    }
    for(const q of pits){
      const gy=ground(q[0]-5)-46;
      for(let k=0;k<7;k++){const x=q[0]-10+k*(q[1]-q[0]+20)/6;rings.push({x,y:gy-Math.sin(k/6*Math.PI)*46,got:false})}
    }
    for(const s of springs)for(let k=0;k<5;k++)rings.push({x:s.x,y:ground(s.x)-70-k*22,got:false});
  }else{
    for(let gx=260;gx<LEN-300;gx+=300)for(let k=0;k<4;k++)rings.push({x:gx+k*22,y:ground(gx)-30,got:false});
    boss={x:LEN/2+250,y:-60,hp:BHP[L.z],max:BHP[L.z],s:'enter',t:0,n:0,a:-1,dir:-1,inv:0,dead:false,dt:0,tx:0,cd:1,kit:KITS[L.z],rt:0};
  }
}

/* ---------- state ---------- */
const inp={l:false,r:false,d:false,j:false};let jEdge=false;
const p={};
let state='menu',score=0,score0=0,lives=3,frames=0,respX=100,camX=0,camY=0,look=0,endT=0,deadT=0,signSpin=0,lastT=0,acc=0,banner=0;
function frac(){return VH>260?.4:.58}
function resetPlayer(x){
  Object.assign(p,{x,y:ground(x)-R,xs:0,ys:0,gs:0,gr:true,roll:false,jumped:false,face:1,inv:0,crouch:false,charge:0,rings:0,dead:false,rot:0,spin:0,anim:0,hurt:false});
  look=0;camX=Math.max(0,x-VW*.4);camY=p.y-VH*frac();bombs=[];shots=[];
}
function startLevel(i,keep){
  initAudio();
  genLevel(i);
  if(!keep)score=0;score0=score;
  lives=3;frames=0;respX=100;endT=0;signSpin=0;banner=190;
  resetPlayer(100);state='play';ov.hidden=true;
}
function addParts(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,l:30,c:col})}}
function hurt(){
  if(p.inv>0||p.dead||state==='clear')return;
  if(p.rings>0){
    const n=Math.min(p.rings,12);
    for(let i=0;i<n;i++){const a=(i/n)*6.28;fly.push({x:p.x,y:p.y,xs:Math.cos(a)*(2+Math.random()*2),ys:Math.sin(a)*3-3,t:0})}
    p.rings=0;p.gr=false;p.xs=-p.face*2;p.ys=-4;p.roll=false;p.jumped=false;p.crouch=false;p.hurt=true;p.inv=120;beep(300,.3,'sawtooth',.06,.4);
  }else die();
}
function die(){if(p.dead)return;p.dead=true;p.ys=-8;p.xs=0;p.gr=false;state='dead';deadT=0;beep(400,.5,'sawtooth',.07,.2)}

/* ---------- menus ---------- */
function setBtns(list){
  btnsEl.innerHTML='';
  for(const b of list){const e=document.createElement('button');e.className='b'+(b.alt?' alt':'');e.textContent=b.t;e.addEventListener('click',b.fn);btnsEl.appendChild(e)}
}
function showOv(t,b,list){ot.textContent=t;ob.textContent=b||'';selEl.innerHTML='';setBtns(list);ov.hidden=false}
function showTitle(){
  showOv('Blue Dash','4 главы, 12 уровней и 4 босса.\nБеги, прыгай на врагов, собирай кольца.\n◀ ▶ бег · ПРЫЖОК · ▼ шар\nСтоя: держи ▼ и жми ПРЫЖОК, потом отпусти ▼ для рывка.',
    [{t:unlocked>0?'Продолжить':'Играть',fn:()=>startLevel(unlocked)},{t:'Главы',alt:true,fn:showSel}]);
}
function showSel(back){
  showOv('Главы','',[{t:'Назад',alt:true,fn:()=>state==='menu'?showTitle():showPause()}]);
  ZONES.forEach((zn,z)=>{
    const row=document.createElement('div');row.className='row';
    const nm=document.createElement('div');nm.className='nm';nm.innerHTML='<span class="dot"></span><span></span>';
    nm.firstChild.style.background=zn.dot;nm.lastChild.textContent=zn.n;row.appendChild(nm);
    for(let a=0;a<3;a++){const idx=z*3+a,b=document.createElement('button');b.className='b'+(idx===unlocked?'':' alt');b.textContent=ACTN[a];b.disabled=idx>unlocked;b.addEventListener('click',()=>startLevel(idx));row.appendChild(b)}
    selEl.appendChild(row);
  });
}
function showPause(){
  showOv('Пауза','',[{t:'Продолжить',fn:()=>{ov.hidden=true}},{t:'Заново',alt:true,fn:()=>startLevel(cur)},{t:'Главы',alt:true,fn:showSel}]);
}
document.getElementById('pb').addEventListener('click',()=>{if(ov.hidden&&state!=='menu'){inp.l=inp.r=inp.d=inp.j=false;showPause()}});
document.getElementById('pb').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- boss ---------- */
function setS(s){const b=boss;b.s=s;b.t=0;b.n=0;if(s==='dive')b.tx=p.x;if(s==='charge')b.cd=p.x>b.x?1:-1}
function updateBoss(){
  const b=boss;
  if(b.dead){b.dt++;b.y+=.6;if(b.dt%5===0)addParts(b.x+(Math.random()-.5)*50,b.y+(Math.random()-.5)*30,6,'#ffb020');if(b.dt%20===0)beep(150+Math.random()*100,.3,'sawtooth',.06,.3);return}
  if(b.inv>0)b.inv--;b.t++;
  const fast=1+(1-b.hp/b.max)*.8,gy=ground(b.x);
  const bob=()=>85+Math.sin(b.t*.06)*14;
  if(b.s==='enter'){b.y+=(85-b.y)*.05;if(b.t>70)setS('hover')}
  else if(b.s==='hover'){
    b.x+=b.dir*1.5*fast;if(b.x<200)b.dir=1;if(b.x>LEN-200)b.dir=-1;
    b.y+=(bob()-b.y)*.1;
    if(b.t>120/fast){b.a=(b.a+1)%b.kit.length;setS(b.kit[b.a])}
  }else if(b.s==='bomb'){
    b.x+=b.dir*1.3*fast;if(b.x<200)b.dir=1;if(b.x>LEN-200)b.dir=-1;
    b.y+=(bob()-b.y)*.1;
    if(b.t%26===13){bombs.push({x:b.x,y:b.y+20,vy:0});beep(220,.1,'square',.04)}
    if(b.t>120)setS('hover');
  }else if(b.s==='shoot'){
    b.y+=(bob()-b.y)*.1;
    if(b.t%26===13){const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;shots.push({x:b.x,y:b.y+8,vx:dx/d*3.4,vy:dy/d*3.4});beep(700,.12,'sawtooth',.04,.5)}
    if(b.t>100)setS('hover');
  }else if(b.s==='dive'){
    if(b.n===0){b.x+=(b.tx-b.x)*.08;b.y+=(70-b.y)*.1;if(b.t>45){b.n=1}}
    else if(b.n===1){b.x+=(b.tx-b.x)*.05;b.y+=8*fast;if(b.y>=ground(b.x)-26){b.y=ground(b.x)-26;b.n=2;b.t=0;addParts(b.x,b.y+26,10,'#ddd');beep(120,.2,'sawtooth',.07,.4)}}
    else if(b.n===2){if(b.t>40)b.n=3}
    else{b.y-=4;if(b.y<=85)setS('hover')}
  }else if(b.s==='charge'){
    if(b.n===0){b.y+=((ground(b.x)-24)-b.y)*.12;if(b.t>50){b.n=1;beep(160,.4,'sawtooth',.06,2)}}
    else if(b.n===1){b.x+=b.cd*6*fast;b.y=ground(b.x)-24;if(b.t%8===0)addParts(b.x,b.y+22,2,'#ddd');if(b.x<150||b.x>LEN-150){b.x=Math.max(150,Math.min(LEN-150,b.x));b.n=2}}
    else{b.y-=3;if(b.y<=85){b.dir=b.x>LEN/2?-1:1;setS('hover')}}
  }
  // contact
  if(!p.dead&&b.inv===0&&Math.abs(b.x-p.x)<30&&Math.abs(b.y-p.y)<30){
    if(p.roll||p.jumped){
      b.hp--;b.inv=55;addParts(b.x,b.y,14,'#fff');beep(140,.35,'sawtooth',.08,.3);score+=300;
      p.gr=false;p.ys=-4.5;p.xs=(p.x<b.x?-1:1)*3;p.jumped=true;p.roll=true;
      if(b.hp<=0){b.dead=true;b.dt=0;bombs.length=0;shots.length=0;score+=1000}
    }else hurt();
  }
  // refill rings
  if(++b.rt%260===0&&rings.filter(r=>!r.got).length<8){const x=250+Math.random()*(LEN-500);for(let k=0;k<5;k++)rings.push({x:x+k*22,y:ground(x)-30,got:false})}
}
function updateProjectiles(){
  for(let i=bombs.length-1;i>=0;i--){
    const q=bombs[i];q.vy+=.12;q.y+=q.vy;let rm=false;
    if(!p.dead&&Math.hypot(p.x-q.x,p.y-q.y)<14){hurt();rm=true}
    if(q.y>=ground(q.x)-6){addParts(q.x,q.y,10,'#ff9020');beep(110,.2,'sawtooth',.06,.4);if(!p.dead&&Math.hypot(p.x-q.x,p.y-q.y)<28)hurt();rm=true}
    if(rm)bombs.splice(i,1);
  }
  for(let i=shots.length-1;i>=0;i--){
    const q=shots[i];q.x+=q.vx;q.y+=q.vy;
    if(!p.dead&&Math.hypot(p.x-q.x,p.y-q.y)<13){hurt();shots.splice(i,1)}
    else if(q.y>ground(q.x)||q.x<20||q.x>LEN-20||q.y<-40)shots.splice(i,1);
  }
}

/* ---------- physics ---------- */
function step(){
  frames++;
  if(banner>0)banner--;
  if(state==='dead'){
    deadT++;p.ys+=.2;p.y+=p.ys;
    if(boss)updateBoss();
    if(deadT>100){
      lives--;
      if(lives<0){state='over';showOv('Игра окончена','Счёт: '+score,[{t:'Заново',fn:()=>startLevel(cur,true)},{t:'Главы',alt:true,fn:()=>{state='menu';showSel()}}])}
      else{resetPlayer(respX);state='play'}
    }
    return;
  }
  if(state==='over'||state==='menu')return;
  const clear=state==='clear',g=Z.grip;
  let dir=(inp.r?1:0)-(inp.l?1:0),dn=inp.d;
  if(clear){dir=isBoss?0:1;dn=false}
  const je=jEdge&&!clear;jEdge=false;
  if(p.inv>0)p.inv--;
  p.anim+=Math.abs(p.gr?p.gs:p.xs)*.05+.04;
  const lo=isBoss?60:12,hi=isBoss?LEN-60:LEN+300;
  if(p.gr){
    const t=slope(p.x);
    if(!p.roll&&dn&&Math.abs(p.gs)<.6){
      p.crouch=true;p.gs*=.8;
      if(dir)p.face=dir;
      if(je){p.charge=Math.min(p.charge+2.5,8);beep(300+p.charge*60,.08,'square',.05)}
      p.charge*=.992;
    }else{
      if(p.crouch){
        p.crouch=false;
        if(p.charge>.5){p.gs=p.face*(7+p.charge*.8);p.roll=true;beep(200,.25,'sawtooth',.07,3)}
        p.charge=0;
      }
      const uphillRoll=p.gs*t.y<0;
      p.gs+=(p.roll?(uphillRoll?.1:.35):.15)*t.y;
      if(!p.roll){
        if(dir){
          p.face=dir;
          if(dir*p.gs<0)p.gs+=dir*.5*(.3+.7*g);
          else if(Math.abs(p.gs)<6)p.gs+=dir*.06*(.4+.6*g);
        }else{const f=Math.min(Math.abs(p.gs),.05*g);p.gs-=Math.sign(p.gs)*f}
        if(dn&&Math.abs(p.gs)>=1){p.roll=true;beep(250,.15,'square',.04,2)}
      }else{
        if(dir&&dir*p.gs<0)p.gs+=dir*.125;
        const f=Math.min(Math.abs(p.gs),.025*g);p.gs-=Math.sign(p.gs)*f;
        if(Math.abs(p.gs)<.4&&!p.jumped)p.roll=false;
      }
      p.gs=Math.max(-16,Math.min(16,p.gs));
      if(Math.abs(p.gs)>.1)p.face=p.gs>0?1:-1;
      if(je){
        p.xs=p.gs*t.x+t.y*6.5;p.ys=p.gs*t.y-t.x*6.5;
        p.gr=false;p.jumped=true;p.roll=true;p.crouch=false;beep(520,.22,'square',.05,2);
      }
    }
    if(p.gr){
      const nx=p.x+p.gs*t.x,ey=p.y+p.gs*t.y,gy=ground(nx)-R;
      if(gy-p.y>16||(gy-ey>1.5&&Math.abs(p.gs)>5)){p.gr=false;p.xs=p.gs*t.x;p.ys=p.gs*t.y;p.x=nx;p.y=ey}
      else{p.x=nx;p.y=gy}
      if(p.x<lo){p.x=lo;p.gs=0}
      if(p.x>hi){p.x=hi;p.gs=0}
      const tt=slope(p.x);p.rot+=(Math.atan2(tt.y,tt.x)-p.rot)*.3;
    }
  }else{
    if(p.hurt){p.ys+=.19}else{
      if(dir){
        if(dir*p.xs<0||Math.abs(p.xs)<6)p.xs+=dir*.09;
        if(!p.jumped)p.face=dir;
      }
      if(!inp.j&&p.jumped&&p.ys<-4)p.ys=-4;
      if(p.ys<0&&p.ys>-4)p.xs-=p.xs/32;
      p.ys+=.21875;
    }
    if(p.ys>16)p.ys=16;
    p.x+=p.xs;p.y+=p.ys;
    if(p.x<lo){p.x=lo;p.xs=0}
    if(p.x>hi){p.x=hi;p.xs=0}
    p.rot*=.9;
    const gg=ground(p.x)-R;
    if(p.y>=gg&&!inPit(p.x)){
      const t=slope(p.x);p.y=gg;p.gr=true;p.gs=Math.abs(t.y)<.2?p.xs:p.xs*t.x+p.ys*t.y;
      p.jumped=false;p.hurt=false;if(!(dn&&Math.abs(p.gs)>1))p.roll=false;
    }
    if(p.y>300)die();
  }
  if(!isBoss&&!clear&&p.x>GOAL){state='clear';endT=0;beep(880,.5,'triangle',.07)}
  if(isBoss&&boss&&boss.dead&&!clear&&boss.dt>90){state='clear';endT=0;beep(880,.5,'triangle',.07)}
  if(clear){
    endT++;signSpin+=.35;
    if(endT===(isBoss?100:150)){
      const secs=Math.floor(frames/60),par=isBoss?90:150,tb=Math.max(0,(par-secs)*20),rb=p.rings*100;
      score+=tb+rb;
      if(cur+1>unlocked&&cur<11){unlocked=cur+1;saveProg()}
      const info='Счёт: '+score+'\nВремя: '+fmt(frames)+' (+'+tb+')\nКольца: '+p.rings+' (+'+rb+')';
      const L=LEVELS[cur];
      if(cur===11)showOv('Победа!','Лавовая крепость пала, и все главы пройдены.\n'+info,[{t:'Главы',fn:()=>{state='menu';showSel()}}]);
      else showOv(isBoss?'Босс побеждён!':'Акт пройден!',(isBoss?'Глава «'+ZONES[L.z].n+'» пройдена.\n':'')+info,
        [{t:'Дальше',fn:()=>startLevel(cur+1,true)},{t:'Главы',alt:true,fn:()=>{state='menu';showSel()}}]);
    }
  }
  for(const c of cps)if(!c.on&&p.x>c.x){c.on=true;respX=c.x;beep(700,.2,'triangle',.06)}
  for(const r of rings)if(!r.got&&Math.abs(r.x-p.x)<17&&Math.abs(r.y-p.y)<19){r.got=true;p.rings++;score+=10;beep(1200,.12,'triangle',.05,1.5)}
  for(let i=fly.length-1;i>=0;i--){
    const f=fly[i];f.t++;f.ys+=.15;f.x+=f.xs;f.y+=f.ys;
    const gg=ground(f.x)-6;if(f.y>gg&&gg<600){f.y=gg;f.ys*=-.7}
    if(isBoss){if(f.x<70){f.x=70;f.xs=-f.xs}if(f.x>LEN-70){f.x=LEN-70;f.xs=-f.xs}}
    if(f.t>40&&Math.abs(f.x-p.x)<17&&Math.abs(f.y-p.y)<19&&!p.dead){p.rings++;fly.splice(i,1);beep(1200,.1,'triangle',.04,1.5)}
    else if(f.t>260||f.y>400)fly.splice(i,1);
  }
  for(const s of springs){
    if(s.t>0)s.t--;
    const gy=ground(s.x);
    if(Math.abs(p.x-s.x)<15&&p.y+R>gy-12&&p.y+R<gy+8&&!p.dead){
      p.gr=false;p.ys=-11;p.jumped=false;p.roll=false;p.hurt=false;s.t=14;beep(500,.3,'square',.06,3);
    }
  }
  for(const s of spikes){
    const gy=ground(s.x);
    if(Math.abs(p.x-s.x)<20&&p.y+R>gy-13&&p.y<gy&&!p.dead)hurt();
  }
  for(const f of fireballs){
    f.t++;
    if(f.vy===0&&f.y>=290){if(f.t>140){f.vy=-9.5;f.t=0;f.y=289}}
    else{f.vy+=.25;f.y+=f.vy;if(f.y>=290){f.y=290;f.vy=0}}
    if(f.y<285&&!p.dead&&Math.abs(f.x-p.x)<13&&Math.abs(f.y-p.y)<17)hurt();
  }
  const att=p.roll||p.jumped;
  for(const e of enemies){
    if(!e.alive)continue;
    e.ph+=.15;e.x+=e.d*(e.f?.9:.7);
    if(e.x>e.x1||e.x<e.x0||(!e.f&&inPit(e.x+e.d*20)))e.d*=-1;
    e.y=e.f?ground(e.x)-62+Math.sin(e.ph*.8)*18:ground(e.x)-10;
    if(Math.abs(e.x-p.x)<19&&Math.abs(e.y-p.y)<21&&!p.dead){
      if(att){
        e.alive=false;score+=100;addParts(e.x,e.y,12,'#ffd21f');beep(180,.25,'sawtooth',.06,.3);
        if(!p.gr){p.ys=p.jumped&&inp.j?-5.5:Math.min(-3,-Math.abs(p.ys)*.9)}
      }else hurt();
    }
  }
  if(boss)updateBoss();
  updateProjectiles();
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.15;if(--q.l<=0)parts.splice(i,1)}
  const sp=p.gr?p.gs:p.xs;
  look+=(Math.max(-12,Math.min(12,sp))*12-look)*.05;
  const mx=Math.max(0,LEN+(isBoss?60:300)-VW);
  const tx=Math.max(0,Math.min(mx,p.x-VW/2+look));camX+=(tx-camX)*.2;
  if(state!=='dead'){const ty=p.y-VH*frac();camY+=Math.max(-12,Math.min(12,(ty-camY)*.1))}
}
function fmt(f){const s=Math.floor(f/60);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

/* ---------- drawing ---------- */
function hills(par,base,amp,f1,f2,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,VH+400);
  const o=camX*par,oy=-camY*par*.5;
  for(let x=0;x<=VW+8;x+=8)ctx.lineTo(x,base+oy+Math.sin((x+o)/f1)*amp+Math.sin((x+o)/f2+1.3)*amp*.4);
  ctx.lineTo(VW+8,VH+400);ctx.fill();
}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,Z.sky[0]);g.addColorStop(1,Z.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH+10);
  if(Z.fx===1){ctx.fillStyle='rgba(255,240,200,.9)';ctx.beginPath();ctx.arc(VW*.75,48,22,0,6.3);ctx.fill()}
  else if(Z.fx===3){ctx.fillStyle='rgba(255,90,30,.35)';ctx.beginPath();ctx.arc(VW*.3,VH*.5,60,0,6.3);ctx.fill()}
  else{
    ctx.fillStyle=Z.fx===2?'rgba(255,255,255,.55)':'rgba(255,255,255,.85)';
    for(let i=0;i<7;i++){
      const cx=((i*173-camX*.1)%(VW+200)+VW+200)%(VW+200)-100,cy=24+(i*37%60);
      ctx.beginPath();ctx.ellipse(cx,cy,26,9,0,0,6.3);ctx.ellipse(cx+18,cy-6,18,9,0,0,6.3);ctx.ellipse(cx-16,cy-3,16,8,0,0,6.3);ctx.fill();
    }
  }
  hills(.2,VH*.55+20,Z.fx===1?34:26,Z.fx===2?45:70,29,Z.far);
  hills(.4,VH*.55+55,22,Z.fx===1?90:55,23,Z.mid);
  if(Z.fx===2){ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<40;i++){const x=((i*97-camX*.5+frames*.3*(1+i%3*.3))%VW+VW)%VW,y=(i*53+frames*(.6+i%3*.3))%VH;ctx.fillRect(x,y,2,2)}}
  if(Z.fx===3){ctx.fillStyle='#ff9a3a';for(let i=0;i<30;i++){const x=((i*131-camX*.4+Math.sin(frames*.03+i)*10)%VW+VW)%VW,y=VH-((i*53+frames*(.5+i%3*.3))%VH);ctx.fillRect(x,y,2,2)}}
}
function drawTerrain(){
  const path=new Path2D(),x0=Math.floor(camX/6)*6-6,pts=[];
  for(let wx=x0;wx<=camX+VW+12;wx+=6){let gy=ground(wx);if(gy>=600)gy=camY+VH+60;pts.push([wx-camX,gy-camY])}
  path.moveTo(pts[0][0],VH+60);
  for(const q of pts)path.lineTo(q[0],q[1]);
  path.lineTo(pts[pts.length-1][0],VH+60);path.closePath();
  if(Z.fx===3)for(const q of pits){const sx=q[0]-camX,w=q[1]-q[0];if(sx>VW||sx+w<0)continue;const ly=290-camY,gr=ctx.createLinearGradient(0,ly,0,ly+40);gr.addColorStop(0,'#ffcc33');gr.addColorStop(1,'#d62a10');ctx.fillStyle=gr;ctx.fillRect(sx-4,ly,w+8,VH+80)}
  ctx.fillStyle=Z.f1;ctx.fill(path);
  ctx.save();ctx.clip(path);
  ctx.fillStyle=Z.f2;
  const cs=24,cx0=Math.floor(camX/cs),cy0=Math.floor((camY+60)/cs);
  for(let cx=cx0;cx<cx0+VW/cs+2;cx++)for(let cy=cy0;cy<cy0+VH/cs+4;cy++)if((cx+cy)&1)ctx.fillRect(cx*cs-camX,cy*cs-camY,cs,cs);
  ctx.restore();
  ctx.lineJoin='round';
  ctx.beginPath();pts.forEach((q,i)=>{i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});
  ctx.strokeStyle=Z.g1;ctx.lineWidth=12;ctx.stroke();
  ctx.strokeStyle=Z.g2;ctx.lineWidth=3;ctx.stroke();
}
function ringSprite(x,y,ph){

  ctx.beginPath();ctx.ellipse(x,y,w,6,0,0,6.3);ctx.stroke();
}
function drawBoss(){
  const b=boss,sx=b.x-camX,sy=b.y-camY;

  const flash=b.inv>0&&(b.inv>>2)%2===0,col=flash?'#ffffff':Z.bc;

  ctx.fillStyle='rgba(190,235,255,.9)';ctx.beginPath();ctx.arc(0,-4,16,Math.PI,0);ctx.fill();
  ctx.fillStyle='#f5cfa0';ctx.beginPath();ctx.ellipse(0,-3,9,8,0,0,6.3);ctx.fill();

function drawObjects(){

      ctx.fillStyle='#222';ctx.fillRect(-4,-3,3,6);ctx.fillRect(2,-3,3,6);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-2,3,0,6.3);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(8,-2,1.4,0,6.3);ctx.fill();
      ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-18,2);ctx.lineTo(-12,3);ctx.fill();
    }else{
      ctx.fillStyle=Z.en;ctx.beginPath();ctx.ellipse(0,0,13,9,0,Math.PI,0);ctx.fill();
      ctx.fillRect(-13,0,26,5);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-3,3.2,0,6.3);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(7,-3,1.5,0,6.3);ctx.fill();
      ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-6,7,4,0,6.3);ctx.arc(6,7,4,0,6.3);ctx.fill();
      ctx.fillStyle='#999';ctx.fillRect(-1,-14+Math.sin(e.ph)*1.5,2,6);
    }

  }
  if(boss)drawBoss();
  for(const q of bombs){const sx=q.x-camX,sy=q.y-camY;ctx.fillStyle='#222';ctx.beginPath();ctx.arc(sx,sy,6,0,6.3);ctx.fill();ctx.fillStyle='#ff9020';ctx.fillRect(sx-1,sy-10,2,5)}
  for(const q of shots){const sx=q.x-camX,sy=q.y-camY;ctx.fillStyle=Z.bc;ctx.beginPath();ctx.arc(sx,sy,6,0,6.3);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,2.5,0,6.3);ctx.fill()}
  for(const q of parts){ctx.globalAlpha=q.l/30;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x-camX,q.y-camY,3,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;
}
function drawPlayer(){
  if(p.inv>0&&!p.dead&&(p.inv>>2)%2===0)return;

  const BLUE='#2563eb',DK='#1a46b8',SKIN='#f5cfa0';

    ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(0,0,10.5,0,6.3);ctx.fill();

    ctx.beginPath();ctx.arc(0,0,6,3.5,5.5);ctx.stroke();

  }else{

    ctx.beginPath();ctx.moveTo(-5,-16);ctx.lineTo(-22,-13);ctx.lineTo(-6,-7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-7,-9);ctx.lineTo(-24,-4);ctx.lineTo(-6,0);ctx.fill();
    ctx.beginPath();ctx.moveTo(-6,-2);ctx.lineTo(-21,6);ctx.lineTo(-4,5);ctx.fill();
    ctx.fillStyle=BLUE;ctx.beginPath();ctx.ellipse(0,3,8,9,0,0,6.3);ctx.fill();
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.ellipse(3,5,4.5,6,0,0,6.3);ctx.fill();
    ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(1,-6,9.5,0,6.3);ctx.fill();
    ctx.beginPath();ctx.moveTo(-2,-13);ctx.lineTo(1,-21);ctx.lineTo(5,-13);ctx.fill();
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.ellipse(6,-3,6,5,0,0,6.3);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(11,-4,1.8,0,6.3);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(4,-8,3.6,4.5,0,0,6.3);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(5.4,-8,1.6,0,6.3);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,6,2.6,0,6.3);ctx.fill();
    const run=p.gr&&Math.abs(p.gs)>.3,fast=p.gr&&Math.abs(p.gs)>=7;
    ctx.fillStyle='#e02828';
    if(fast){ctx.save();ctx.translate(0,9);ctx.rotate(p.anim*3);ctx.beginPath();ctx.ellipse(0,0,8,3.5,0,0,6.3);ctx.fill();ctx.rotate(1.57);ctx.beginPath();ctx.ellipse(0,0,8,3.5,0,0,6.3);ctx.fill();ctx.restore()}
    else{
      const ph=run?Math.sin(p.anim*4)*6:0,lift=run?Math.max(0,Math.cos(p.anim*4))*3:0,air=!p.gr?3:0;
      ctx.beginPath();ctx.ellipse(3+ph,12-lift-air,6,3.8,0,0,6.3);ctx.fill();
      ctx.beginPath();ctx.ellipse(3-ph,12-(run?Math.max(0,-Math.cos(p.anim*4))*3:0)-air,6,3.8,0,0,6.3);ctx.fill();
    }
  }
  ctx.restore();
}
function drawHud(){
  const x=14,y=24;ctx.font='italic 800 13px "Trebuchet MS",system-ui,sans-serif';ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const line=(l,v,yy,warn)=>{ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.fillStyle='#ffd21f';ctx.strokeText(l,x,yy);ctx.fillText(l,x,yy);const w=ctx.measureText(l+' ').width;ctx.strokeText(v,x+w,yy);ctx.fillStyle=warn?'#ff4a4a':'#fff';ctx.fillText(v,x+w,yy)};
  const top=Math.max(0,parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)/SC;
  line('СЧЁТ',String(score),y+top);line('ВРЕМЯ',fmt(frames),y+17+top);
  line('КОЛЬЦА',String(p.rings),y+34+top,p.rings===0&&(frames>>4)%2===0);
  line('ЖИЗНИ','× '+Math.max(0,lives),y+51+top);
  if(boss&&!boss.dead&&boss.s!=='enter'){
    const w=Math.min(160,VW-130),bx=VW/2-w/2+10,by=14+top;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(bx-2,by-2,w+4,12);
    ctx.fillStyle=Z.bc;ctx.fillRect(bx,by,w*boss.hp/boss.max,8);
    ctx.fillStyle='#fff';ctx.font='800 10px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('БОСС',bx+w/2,by+22);
  }
  if(banner>0){
    const a=Math.min(1,banner/30,(190-banner)/20);
    ctx.globalAlpha=Math.max(0,a);ctx.textAlign='center';
    const L=LEVELS[cur],cy=VH*.32;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,cy-28,VW,64);
    ctx.fillStyle='#ffd21f';ctx.font='italic 900 24px "Trebuchet MS",system-ui,sans-serif';ctx.fillText(Z.n.toUpperCase(),VW/2,cy);
    ctx.fillStyle='#fff';ctx.font='italic 800 15px "Trebuchet MS",system-ui,sans-serif';ctx.fillText(L.act===2?'БОСС':'АКТ '+(L.act+1),VW/2,cy+24);
    ctx.globalAlpha=1;
  }
}
function render(){
  ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  drawBg();drawTerrain();drawObjects();drawPlayer();drawHud();
}

/* ---------- input ---------- */
function setKey(k,v){if(k==='j'&&v&&!inp.j)jEdge=true;inp[k]=v;
  if(k==='j')document.getElementById('bj').classList.toggle('on',v);
  if(k==='d')document.getElementById('bd').classList.toggle('on',v)}
document.querySelectorAll('button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}setKey(k,true)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();setKey(k,false)}));
});
const dpad=document.getElementById('dpad'),dl=document.getElementById('dl'),dr=document.getElementById('dr');
function dp(e){const r=dpad.getBoundingClientRect(),rel=(e.clientX-r.left)/r.width;const l=rel<.5,rr=!l;inp.l=l;inp.r=rr;dl.classList.toggle('on',l);dr.classList.toggle('on',rr)}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();try{dpad.setPointerCapture(e.pointerId)}catch(_){}dp(e)});
dpad.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)dp(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>dpad.addEventListener(n,()=>{inp.l=inp.r=false;dl.classList.remove('on');dr.classList.remove('on')}));
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'d',KeyS:'d',Space:'j',KeyZ:'j',ArrowUp:'j',KeyW:'j'};
addEventListener('keydown',e=>{const k=km[e.code];if(k){e.preventDefault();if(!e.repeat)setKey(k,true)}});
addEventListener('keyup',e=>{const k=km[e.code];if(k)setKey(k,false)});
addEventListener('pointerdown',initAudio);

/* ---------- loop ---------- */
function loop(t){
  if(!lastT)lastT=t;
  acc+=Math.min(100,t-lastT);lastT=t;
  let n=0;while(acc>=1000/60&&n<6){if(ov.hidden)step();acc-=1000/60;n++}
  render();requestAnimationFrame(loop);
}
genLevel(0);resetPlayer(100);banner=0;
showTitle();
requestAnimationFrame(loop);
window.__sonic={p,inp,start:startLevel,get state(){return state},get boss(){return boss},get lvl(){return cur}};
})();
</script>
