<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Создай пароль</title>
<style>
  :root{--bg:#0b1020;--panel:#121a33;--text:#d7e3ff;--dim:#7a8bb5;--ok:#2ecc71;--no:#ff5c6c;--acc:#00e5ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:520px}
  h1{color:var(--acc);text-align:center;margin:8px 0}
  p.sub{text-align:center;color:var(--dim);margin:0 0 14px}
  input{width:100%;padding:14px;font-size:20px;background:var(--panel);color:var(--text);border:2px solid #3a4466;border-radius:10px;outline:none}
  input:focus{border-color:var(--acc)}
  .rule{display:flex;gap:10px;align-items:flex-start;padding:12px;margin-top:10px;border-radius:10px;background:var(--panel);border-left:5px solid var(--no)}
  .rule.ok{border-left-color:var(--ok)}
  .rule b{color:var(--dim);font-size:13px;display:block}
  .win{margin-top:14px;padding:16px;border-radius:10px;background:#12351f;color:var(--ok);text-align:center;font-size:18px}
  .meta{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Создай пароль</h1>
  <p class="sub">Придумай пароль, который выполнит все правила. Правила открываются по одному.</p>
  <input id="pw" autofocus autocomplete="off" placeholder="Введи пароль...">
  <div class="meta"><span id="len">Длина: 0</span><span id="cnt"></span></div>
  <div id="rules"></div>
  <div id="win"></div>
</div>
<script>
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const digitsSum=s=>[...s].filter(c=>/\d/.test(c)).reduce((a,c)=>a+ +c,0);
const RULES=[
  ["Минимум 8 символов",p=>p.length>=8],
  ["Хотя бы одна цифра",p=>/\d/.test(p)],
  ["Хотя бы одна заглавная буква",p=>/[A-ZА-ЯЁ]/.test(p)],
  ["Хотя бы один спецсимвол (!@#$%&*?)",p=>/[!@#$%&*?]/.test(p)],
  ["Сумма всех цифр должна равняться 20",p=>digitsSum(p)===20],
  ["Пароль содержит название месяца (по-русски, например «май»)",p=>MONTHS.some(m=>p.toLowerCase().includes(m))],
  ["Пароль содержит римское число (например XIV)",p=>/[IVXLCDM]{2,}/.test(p)],
  ["Пароль содержит эмодзи",p=>/\p{Extended_Pictographic}/u.test(p)],
  ["Нельзя подряд три одинаковых символа",p=>p.length>0&&!/(.)\1\1/su.test(p)],
  ["Длина пароля — ровно простое число",p=>{const n=[...p].length;if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true}],
  ["Пароль заканчивается на букву «Я»",p=>/[яЯ]$/.test(p)],
];
const pw=document.getElementById("pw");
let unlocked=1;
function update(){
  const p=pw.value;
  document.getElementById("len").textContent="Длина: "+[...p].length;
  const res=RULES.map(r=>r[1](p));
  // открыть следующие правила, пока все открытые выполнены
  while(unlocked<RULES.length&&res.slice(0,unlocked).every(Boolean))unlocked++;
  let html="";
  for(let i=unlocked-1;i>=0;i--){
    html+=`<div class="rule ${res[i]?"ok":""}"><span>${res[i]?"✅":"❌"}</span><div><b>Правило ${i+1}</b>${RULES[i][0]}</div></div>`;
  }
  document.getElementById("rules").innerHTML=html;
  const done=res.filter(Boolean).length;
  document.getElementById("cnt").textContent=`Выполнено: ${done}/${RULES.length}`;
  document.getElementById("win").innerHTML=res.every(Boolean)?'<div class="win">🎉 Отлично! Ты создал пароль, который выполняет все правила!</div>':"";
}
pw.addEventListener("input",update);update();
</script>
</body>
</html>
