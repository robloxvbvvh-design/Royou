name: Build keyboard APK
on:
  push:
    paths: ["keyboard/**", ".github/workflows/build-keyboard.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p keyboard assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: royou-keyboard-apk
          path: keyboard/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases (download from phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp keyboard/app/build/outputs/apk/debug/app-debug.apk royou-keyboard.apk
          gh release delete keyboard-latest -y --cleanup-tag || true
          gh release create keyboard-latest royou-keyboard.apk --prerelease \
            --title "Royou Keyboard (latest)" --target "$GITHUB_SHA" \
            --notes "Debug APK. Install it, open the app, then enable the keyboard in settings."
